name: messd-prod

x-app: &app
  env_file:
    - path: .env
      required: true
  restart: always
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'

services:
  postgres:
    <<: *app
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  turn:
    <<: *app
    image: coturn/coturn:4.18.0
    network_mode: host
    command:
      - --listening-port=3478
      - --tls-listening-port=5349
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET}
      - --realm=${TURN_REALM}
      - --external-ip=${RTC_ANNOUNCED_ADDRESS}
      - --min-port=49160
      - --max-port=49200
      - --cert=/certs/fullchain.pem
      - --pkey=/certs/privkey.pem
      - --no-multicast-peers
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --log-file=stdout
    volumes:
      - ${TURN_CERTS_DIR:-./certs}:/certs:ro

  api:
    <<: *app
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: prod
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      API_PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy

  core:
    <<: *app
    build:
      context: .
      dockerfile: apps/core/Dockerfile
      target: prod
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CORE_PORT: 4000
      APP_ORIGINS: https://${DOMAIN}
      RTC_PORT: 40000
    ports:
      - 40000-40015:40000-40015/udp
      - 40000-40015:40000-40015/tcp
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    <<: *app
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: prod
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
      core:
        condition: service_healthy

volumes:
  postgres:
  caddy-data:
  caddy-config:
